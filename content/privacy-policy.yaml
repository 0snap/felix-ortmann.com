headline: Privacy Policy
controller_headline: Controller (Art. 4(7) GDPR)
disclaimer:
  - This privacy policy explains which personal data is processed when you visit this website or contact me, for what purpose, and which rights you have under the EU General Data Protection Regulation (GDPR).
  - "In short: this website sets no cookies, uses no analytics or tracking, and embeds no third-party content. Fonts and icons are served from this website itself."
  - Last updated November 2026.
paragraphs:
  - title: Hosting and server logs
    text: This website is hosted on <a target="_blank" rel="noopener noreferrer" href="https://pages.github.com/">GitHub Pages</a>, a service of GitHub, Inc., 88 Colin P. Kelly Jr. Street, San Francisco, CA 94107, USA. When you visit the website, GitHub processes technical access data such as your IP address, date and time of the request, the requested page, the referring page and your browser's user agent. This is necessary to deliver the website and to keep it secure and stable. The legal basis is Art. 6(1)(f) GDPR (legitimate interest in a reliable and secure website). This involves a transfer of data to the USA; GitHub states that it participates in the EU-U.S. Data Privacy Framework. How long GitHub stores this data is outside my control. Details are in <a target="_blank" rel="noopener noreferrer" href="https://docs.github.com/en/site-policy/privacy-policies/github-general-privacy-statement">GitHub's privacy statement</a>.
  - title: Contact by email
    text: If you contact me by email, I process the data you send me (e.g. your name, email address and the content of your message) to answer your inquiry. The legal basis is Art. 6(1)(b) GDPR if your inquiry relates to a contract or its preparation, otherwise Art. 6(1)(f) GDPR (legitimate interest in answering inquiries). My emails are hosted by Google Workspace, a service of Google Ireland Limited, Gordon House, Barrow Street, Dublin 4, Ireland, which processes them on my behalf under a data processing agreement (Art. 28 GDPR). Data may be transferred to Google LLC in the USA; Google participates in the EU-U.S. Data Privacy Framework. I delete the data once it is no longer needed, unless statutory retention obligations, for example under German tax law, require me to keep it longer.
  - title: Links to other websites
    text: This website links to external profiles (LinkedIn, Malt, freelancermap, GitHub) and certificate pages. No data is transferred to these services until you click a link. After that, the privacy policy of the respective provider applies.
  - title: Your rights
    text: You have the right to access your personal data (Art. 15 GDPR), to rectification (Art. 16), erasure (Art. 17), restriction of processing (Art. 18) and data portability (Art. 20). Where processing is based on Art. 6(1)(f) GDPR, you can object to it at any time for reasons arising from your particular situation (Art. 21). To exercise your rights, contact me using the details above.
  - title: Right to lodge a complaint
    text: You have the right to lodge a complaint with a data protection supervisory authority (Art. 77 GDPR). The authority responsible for me is the Hamburg Commissioner for Data Protection and Freedom of Information (Der Hamburgische Beauftragte für Datenschutz und Informationsfreiheit), Ludwig-Erhard-Straße 22, 20459 Hamburg, Germany.
  - title: No automated decisions
    text: I do not use automated decision-making or profiling. You are not obliged to provide personal data; without it, I simply cannot answer an inquiry.
