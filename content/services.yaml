services:
  - title: Platform engineering & GitOps
    text: "Kubernetes platforms built to be operated: ArgoCD hub-and-spoke, OpenTofu, Helm and Kustomize, Kyverno, observability, secrets and certificates – from first cluster to handover."
  - title: Migration to European clouds
    text: "From on-premise or hyperscaler to STACKIT or Scaleway: provider evaluation, migration plan, hands-on execution, with GDPR in mind."
